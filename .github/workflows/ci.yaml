name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

# `vars.RUNS_ON` resolves to the organization's default, a GitHub-hosted image.
# This repository is public, so it must never be pointed at the organization's
# self-hosted runner: a pull request from a fork would run code on it.
# Dependabot always gets a hosted runner.
#
# CI has no Vega Virtual Device, so test/device.test.ts skips itself here; run
# it locally with `npm run test:device`.
jobs:
  checks:
    runs-on: ${{ fromJSON(github.actor == 'dependabot[bot]' && '["ubuntu-24.04"]' || vars.RUNS_ON || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # No dependency needs an install script, and none runs one here.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # The package that npm would publish: the CLI must start from it.
      - run: node dist/bin.js --version

  # SonarQube Cloud analyses the repository from here, with the tests'
  # coverage; its Automatic Analysis is off, as the two cannot run side by
  # side. The analysis is informational and does not fail the build. Only the
  # scan step sees the token, so neither the install nor the tests can read it,
  # and pull requests from forks, which get no secrets, skip the scan.
  sonar:
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, for new-code detection and blame.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - run: npm ci --ignore-scripts
      - run: npm run coverage
      - name: SonarQube Scan
        if: env.HAS_SONAR_TOKEN == 'true'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
