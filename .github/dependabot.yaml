version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '08:00'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    assignees:
      - 'rabestro'
    ignore:
      # TypeScript majors are taken by hand, as in the organization's other
      # repositories: 7 is a new, native compiler.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # Types, the compiler and the formatter move together.
      tooling:
        patterns:
          - 'typescript'
          - '@types/*'
          - 'prettier'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'ci'
