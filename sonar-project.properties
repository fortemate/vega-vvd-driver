# ==============================================================================
# SonarQube Cloud project configuration
# ==============================================================================
# Analysed from CI, by the `sonar` job in .github/workflows/ci.yaml, so that the
# analysis receives test coverage. Automatic Analysis must stay off in SonarQube
# Cloud: the two cannot run side by side.

sonar.organization=fortemate
sonar.projectKey=fortemate_vega-vvd-driver
sonar.projectName=vega-vvd-driver

# The driver, and its tests with the fakes they run against.
sonar.sources=src
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Written by `npm run coverage`, with paths relative to the repository root.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Findings reviewed and accepted, each with its reason. Kept here rather than
# marked in the SonarQube Cloud interface, so the reasoning is reviewed like code.
sonar.issue.ignore.multicriteria=consolePort,ffmpegPath
# The flow starts at the MCP tool. The driver's own callers, the MCP tool and
# the command line, reach the console on 127.0.0.1 only, and on an even port
# from 5554 to 5682, the emulator's own range: the tool's schema checks it, and
# enableGrpc checks it again before anything connects. A library caller that
# passes runConsole another host chooses its target and is trusted, as the code
# that calls it. Either way the token goes only to a port that greets as an
# Android emulator console.
sonar.issue.ignore.multicriteria.consolePort.ruleKey=tssecurity:S5144
sonar.issue.ignore.multicriteria.consolePort.resourceKey=src/console.ts
# `record` runs the ffmpeg found on the PATH, by design: the driver runs on the
# developer's own machine, and the README says that recording needs ffmpeg.
sonar.issue.ignore.multicriteria.ffmpegPath.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.ffmpegPath.resourceKey=src/record.ts
